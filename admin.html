<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Ayman Hafez</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg:      #080808;
  --surface: #0f0f0f;
  --surf2:   #141414;
  --surf3:   #1a1a1a;
  --border:  rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.12);
  --accent:  #ff3c00;
  --gold:    #c9a96e;
  --text:    #f0ede6;
  --muted:   rgba(240,237,230,.45);
  --green:   #22c55e;
  --ff-display:'Bebas Neue',sans-serif;
  --ff-serif:  'Playfair Display',serif;
  --ff-body:   'DM Sans',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--ff-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;opacity:.6;
}
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 10% 20%,rgba(255,60,0,.06) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 80%,rgba(201,169,110,.04) 0%,transparent 70%);
}

/* ══════════════════ LOGIN SCREEN ══════════════════ */
#loginScreen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg); padding:20px;
}
.login-box{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:52px 48px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:24px;
  box-shadow:0 40px 80px rgba(0,0,0,.6);
  text-align:center;
}
.login-logo{
  font-family:var(--ff-display);font-size:26px;letter-spacing:5px;color:var(--text);
  margin-bottom:32px;
}
.login-logo span{color:var(--accent);}
.lock-icon{
  width:64px;height:64px;border-radius:18px;
  background:rgba(255,60,0,.1);border:1px solid rgba(255,60,0,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--accent);
  margin:0 auto 28px;
}
.login-title{font-family:var(--ff-serif);font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:32px;}

.pass-wrap{position:relative;margin-bottom:16px;}
.pass-wrap input{
  width:100%;padding:14px 50px 14px 18px;
  background:var(--surf2);border:1px solid var(--border2);border-radius:12px;
  font-family:var(--ff-body);font-size:15px;color:var(--text);outline:none;transition:.3s;
  letter-spacing:2px;
}
.pass-wrap input::placeholder{letter-spacing:0;color:rgba(240,237,230,.2);}
.pass-wrap input:focus{border-color:rgba(255,60,0,.5);box-shadow:0 0 0 3px rgba(255,60,0,.08);}
.pass-wrap input.error{border-color:rgba(255,60,0,.8);animation:shake .35s ease;}
.toggle-pass{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;transition:.3s;
}
.toggle-pass:hover{color:var(--text);}
.error-msg{font-size:12px;color:var(--accent);margin-bottom:14px;min-height:18px;text-align:left;}

.btn-login{
  width:100%;padding:15px;border-radius:50px;
  background:var(--accent);color:white;
  font-family:var(--ff-body);font-size:14px;font-weight:500;letter-spacing:.5px;
  border:none;cursor:pointer;transition:.35s;
}
.btn-login:hover{background:#d92e00;transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,60,0,.35);}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ══════════════════ ADMIN DASHBOARD ══════════════════ */
#adminPanel{display:none;}

/* Header */
.admin-header{
  position:fixed;top:0;left:0;width:100%;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 5%;
  background:rgba(8,8,8,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap; gap:10px;
}
.admin-logo{font-family:var(--ff-display);font-size:20px;letter-spacing:4px;color:var(--text);}
.admin-logo span{color:var(--accent);}
.admin-logo small{font-size:11px;letter-spacing:3px;color:var(--muted);margin-left:8px;font-family:var(--ff-body);}

.header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.msg-count-badge{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:30px;
  background:rgba(255,60,0,.12);border:1px solid rgba(255,60,0,.25);
  font-size:12px;color:var(--accent);
}
.msg-count-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-refresh{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:30px;
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);
  color:var(--green);font-family:var(--ff-body);font-size:12px;letter-spacing:1px;
  cursor:pointer;transition:.3s;
}
.btn-refresh:hover{background:rgba(34,197,94,.2);}
.btn-refresh.spinning i{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-logout{
  display:flex;align-items:center;gap:8px;
  padding:9px 20px;border-radius:30px;
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);font-family:var(--ff-body);font-size:12px;letter-spacing:1px;
  cursor:pointer;transition:.3s;text-transform:uppercase;
}
.btn-logout:hover{border-color:var(--accent);color:var(--accent);}

/* Loading overlay */
.loading-overlay{
  position:fixed;inset:0;z-index:5000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,8,8,.7);backdrop-filter:blur(4px);
}
.loading-overlay.hidden{display:none;}
.loading-spinner{
  width:48px;height:48px;border-radius:50%;
  border:3px solid var(--border2);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}

/* Main content */
.admin-main{
  position:relative;z-index:1;
  padding:100px 5% 60px;
}

/* Stats bar */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  margin-bottom:40px;
}
.stat-card{
  padding:24px 22px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;transition:.3s;
}
.stat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,60,0,.06),transparent);
  opacity:0;transition:.3s;
}
.stat-card:hover{border-color:rgba(255,60,0,.2);}
.stat-card:hover::before{opacity:1;}
.stat-card-num{
  font-family:var(--ff-display);font-size:42px;line-height:1;
  background:linear-gradient(135deg,var(--text),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.stat-card-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:6px;}

/* Toolbar */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:14px;margin-bottom:24px;
}
.toolbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.section-eyebrow{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:10px;
}
.section-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.section-title{font-family:var(--ff-serif);font-size:24px;font-weight:700;color:var(--text);}

.toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-btn{
  padding:8px 18px;border-radius:30px;
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);font-family:var(--ff-body);font-size:12px;
  cursor:pointer;transition:.3s;
}
.filter-btn:hover,.filter-btn.active{
  background:rgba(255,60,0,.1);border-color:rgba(255,60,0,.4);color:var(--text);
}
.btn-clear-all{
  padding:8px 18px;border-radius:30px;
  background:transparent;border:1px solid rgba(255,60,0,.3);
  color:var(--accent);font-family:var(--ff-body);font-size:12px;
  cursor:pointer;transition:.3s;display:flex;align-items:center;gap:6px;
}
.btn-clear-all:hover{background:rgba(255,60,0,.1);}

/* Empty state */
.empty-state{
  text-align:center;padding:100px 40px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
}
.empty-icon{font-size:48px;color:rgba(255,255,255,.1);margin-bottom:20px;}
.empty-title{font-family:var(--ff-serif);font-size:22px;color:var(--muted);margin-bottom:8px;}
.empty-sub{font-size:13px;color:rgba(240,237,230,.25);}

/* Messages list */
.messages-list{display:flex;flex-direction:column;gap:16px;}

.msg-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;transition:.4s cubic-bezier(.23,1,.32,1);
  position:relative;
}
.msg-card.unread{border-left:3px solid var(--accent);}
.msg-card:hover{border-color:var(--border2);background:#111;}

.msg-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 28px 18px;cursor:pointer;gap:16px;
  flex-wrap:wrap;
}
.msg-left{display:flex;align-items:center;gap:16px;flex:1;min-width:0;}
.msg-avatar{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-display);font-size:20px;color:white;
  background:linear-gradient(135deg,var(--accent),#ff8c42);
}
.msg-meta{flex:1;min-width:0;}
.msg-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;}
.msg-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.msg-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{
  padding:4px 12px;border-radius:20px;font-size:11px;letter-spacing:.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
}
.tag.type-tag{background:rgba(255,60,0,.1);border-color:rgba(255,60,0,.2);color:var(--accent);}
.tag.unread-tag{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.2);color:var(--green);}
.tag.budget-tag{background:rgba(201,169,110,.1);border-color:rgba(201,169,110,.2);color:var(--gold);}

.msg-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.msg-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.msg-chevron{color:var(--muted);font-size:12px;transition:.3s;}
.msg-card.open .msg-chevron{transform:rotate(180deg);}

/* Expanded body */
.msg-body{
  max-height:0;overflow:hidden;
  transition:max-height .45s cubic-bezier(.23,1,.32,1);
}
.msg-card.open .msg-body{max-height:600px;}
.msg-body-inner{
  padding:0 28px 28px;
  border-top:1px solid var(--border);
  padding-top:22px;
}
.msg-detail-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  margin-bottom:20px;
}
.msg-detail{
  background:var(--surf2);border-radius:12px;padding:14px 16px;
}
.msg-detail-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.msg-detail-val{font-size:13px;color:var(--text);}

.msg-text-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.msg-text-box{
  background:var(--surf2);border-radius:12px;padding:18px;
  font-size:14px;color:var(--text);line-height:1.8;
  border-left:3px solid rgba(255,60,0,.3);
}

.msg-actions{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
.act-btn{
  display:flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:30px;font-size:12px;
  font-family:var(--ff-body);cursor:pointer;transition:.3s;border:1px solid;
  text-decoration:none;
}
.act-btn.reply{background:var(--accent);border-color:var(--accent);color:white;}
.act-btn.reply:hover{background:#d92e00;}
.act-btn.mark-read{background:transparent;border-color:var(--border2);color:var(--muted);}
.act-btn.mark-read:hover{border-color:var(--green);color:var(--green);}
.act-btn.delete-btn{background:transparent;border-color:rgba(255,60,0,.2);color:rgba(255,60,0,.6);}
.act-btn.delete-btn:hover{background:rgba(255,60,0,.1);color:var(--accent);border-color:rgba(255,60,0,.4);}

/* Confirm delete modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9000;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--surface);border:1px solid var(--border2);border-radius:20px;
  padding:40px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 40px 80px rgba(0,0,0,.5);
}
.modal-icon{font-size:36px;color:var(--accent);margin-bottom:16px;}
.modal-title{font-family:var(--ff-serif);font-size:20px;color:var(--text);margin-bottom:8px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.modal-btns{display:flex;gap:12px;justify-content:center;}
.modal-cancel{
  padding:11px 26px;border-radius:30px;
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);font-family:var(--ff-body);font-size:13px;cursor:pointer;transition:.3s;
}
.modal-cancel:hover{border-color:var(--text);color:var(--text);}
.modal-confirm{
  padding:11px 26px;border-radius:30px;
  background:var(--accent);border:1px solid var(--accent);
  color:white;font-family:var(--ff-body);font-size:13px;cursor:pointer;transition:.3s;
}
.modal-confirm:hover{background:#d92e00;}

/* Responsive */
@media(max-width:900px){
  .stats-bar{grid-template-columns:repeat(2,1fr);}
  .msg-detail-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:600px){
  .admin-header{padding:14px 4%;}
  .admin-logo small{display:none;}
  .admin-main{padding:80px 4% 60px;}
  .stats-bar{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:18px 16px;}
  .stat-card-num{font-size:32px;}
  .msg-card-header{padding:16px 18px 14px;gap:10px;}
  .msg-body-inner{padding:0 18px 18px;padding-top:16px;}
  .msg-card.open .msg-body{max-height:800px;}
  .msg-detail-grid{grid-template-columns:1fr;}
  .header-right{gap:8px;}
  .msg-count-badge{display:none;}
  .toolbar-right{gap:6px;}
  .filter-btn,.btn-clear-all{padding:7px 12px;font-size:11px;}
  .act-btn{padding:8px 14px;font-size:11px;}
  .msg-tags{display:none;}
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- Loading Overlay -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
</div>

<!-- ══════════ LOGIN SCREEN ══════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">AY<span>.</span>HAFEZ</div>
    <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
    <h2 class="login-title">Admin Access</h2>
    <p class="login-sub">Enter your password to view messages</p>

    <div class="pass-wrap">
      <input type="password" id="passInput" placeholder="Enter password" autocomplete="off">
      <button class="toggle-pass" id="togglePass" tabindex="-1">
        <i class="fa-solid fa-eye" id="eyeIcon"></i>
      </button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-login" id="loginBtn">
      <i class="fa-solid fa-unlock-keyhole"></i> &nbsp;Access Dashboard
    </button>
  </div>
</div>

<!-- ══════════ ADMIN PANEL ══════════ -->
<div id="adminPanel">

  <!-- Header -->
  <header class="admin-header">
    <div>
      <div class="admin-logo">AY<span>.</span>HAFEZ <small>ADMIN</small></div>
    </div>
    <div class="header-right">
      <div class="msg-count-badge">
        <span class="dot"></span>
        <span id="unreadCount">0</span> new
      </div>
      <button class="btn-refresh" id="refreshBtn">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
      <button class="btn-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </header>

  <main class="admin-main">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-card-num" id="statTotal">0</div>
        <div class="stat-card-label">Total Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statUnread">0</div>
        <div class="stat-card-label">Unread</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statToday">0</div>
        <div class="stat-card-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-num" id="statTypes">0</div>
        <div class="stat-card-label">Project Types</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div>
          <div class="section-eyebrow">Inbox</div>
          <div class="section-title">Client Messages</div>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unread">Unread</button>
        <button class="filter-btn" data-filter="read">Read</button>
        <button class="btn-clear-all" id="clearAllBtn">
          <i class="fa-solid fa-trash-can"></i> Clear All
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-list" id="messagesList"></div>

  </main>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h3 class="modal-title">Delete Message?</h3>
    <p class="modal-sub">This action cannot be undone. The message will be permanently removed.</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   JSONBin CONFIG — ضع الـ Bin ID هنا ↓
══════════════════════════════════════════ */
const JSONBIN_ID  = '6a0c09f5ee5a733b12e222a4';
const JSONBIN_KEY = '$2a$10$vY4xGB76klYna9SGy4lZLOubyq68z93XW12wcRvDLV0EoAO2AKIQG';
const BIN_URL     = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

const PASSWORD = 'ayman2026';
const AUTH_KEY = 'ayh_admin_auth';

/* ══════════ JSONBin Helpers ══════════ */
async function fetchMessages(){
  const res = await fetch(BIN_URL+'/latest', {
    headers:{ 'X-Master-Key': JSONBIN_KEY }
  });
  if(!res.ok) throw new Error('Fetch failed: '+res.status);
  const data = await res.json();
  return data.record.messages || [];
}

async function putMessages(msgs){
  const res = await fetch(BIN_URL, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY },
    body: JSON.stringify({ messages: msgs })
  });
  if(!res.ok) throw new Error('Save failed: '+res.status);
}

/* ══════════ Loading helpers ══════════ */
function showLoad(){ document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoad(){ document.getElementById('loadingOverlay').classList.add('hidden'); }

/* ══════════ LOGIN ══════════ */
const loginScreen = document.getElementById('loginScreen');
const adminPanel  = document.getElementById('adminPanel');
const passInput   = document.getElementById('passInput');
const loginBtn    = document.getElementById('loginBtn');
const errorMsg    = document.getElementById('errorMsg');
const togglePass  = document.getElementById('togglePass');
const eyeIcon     = document.getElementById('eyeIcon');

if(sessionStorage.getItem(AUTH_KEY) === 'true'){
  loginScreen.style.display = 'none';
  adminPanel.style.display  = 'block';
  renderDashboard();
}

loginBtn.addEventListener('click', doLogin);
passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
  if(passInput.value === PASSWORD){
    sessionStorage.setItem(AUTH_KEY,'true');
    loginScreen.style.display = 'none';
    adminPanel.style.display  = 'block';
    renderDashboard();
  } else {
    passInput.classList.add('error');
    errorMsg.textContent = 'Incorrect password. Please try again.';
    passInput.value = '';
    setTimeout(()=>passInput.classList.remove('error'), 400);
  }
}

togglePass.addEventListener('click',()=>{
  if(passInput.type==='password'){
    passInput.type='text'; eyeIcon.className='fa-solid fa-eye-slash';
  } else {
    passInput.type='password'; eyeIcon.className='fa-solid fa-eye';
  }
});

/* ══════════ LOGOUT ══════════ */
document.getElementById('logoutBtn').addEventListener('click',()=>{
  sessionStorage.removeItem(AUTH_KEY);
  location.reload();
});

/* ══════════ REFRESH ══════════ */
document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await renderDashboard();
  btn.classList.remove('spinning');
});

/* ══════════ RENDER DASHBOARD ══════════ */
let currentFilter   = 'all';
let pendingDeleteId = null;
let cachedMsgs      = [];

async function renderDashboard(){
  showLoad();
  try {
    cachedMsgs = await fetchMessages();
  } catch(e){
    console.error(e);
    cachedMsgs = [];
  }
  hideLoad();

  const today  = new Date().toDateString();
  const unread = cachedMsgs.filter(m=>!m.read).length;
  const todayN = cachedMsgs.filter(m=>new Date(m.ts).toDateString()===today).length;
  const types  = [...new Set(cachedMsgs.map(m=>m.type).filter(Boolean))].length;

  document.getElementById('statTotal').textContent  = cachedMsgs.length;
  document.getElementById('statUnread').textContent = unread;
  document.getElementById('statToday').textContent  = todayN;
  document.getElementById('statTypes').textContent  = types;
  document.getElementById('unreadCount').textContent= unread;

  renderMessages();
}

function renderMessages(){
  let filtered = [...cachedMsgs];
  if(currentFilter==='unread') filtered = filtered.filter(m=>!m.read);
  if(currentFilter==='read')   filtered = filtered.filter(m=> m.read);

  const list = document.getElementById('messagesList');

  if(filtered.length===0){
    list.innerHTML=`
      <div class="empty-state">
        <div class="empty-icon"><i class="fa-regular fa-envelope-open"></i></div>
        <div class="empty-title">No messages yet</div>
        <div class="empty-sub">When clients send messages from your contact page, they'll appear here.</div>
      </div>`;
    return;
  }

  filtered = [...filtered].reverse();

  list.innerHTML = filtered.map(m=>`
    <div class="msg-card ${m.read?'':'unread'}" id="card-${m.id}" data-id="${m.id}">
      <div class="msg-card-header" onclick="toggleCard('${m.id}')">
        <div class="msg-left">
          <div class="msg-avatar">${m.name.charAt(0).toUpperCase()}</div>
          <div class="msg-meta">
            <div class="msg-name">${escHtml(m.name)}</div>
            <div class="msg-email">${escHtml(m.email)}</div>
          </div>
        </div>
        <div class="msg-tags">
          ${m.type   ? `<span class="tag type-tag">${escHtml(m.type)}</span>` : ''}
          ${m.budget ? `<span class="tag budget-tag">${escHtml(m.budget)}</span>` : ''}
          ${!m.read  ? `<span class="tag unread-tag">New</span>` : ''}
        </div>
        <div class="msg-right">
          <span class="msg-time">${formatTime(m.ts)}</span>
          <i class="fa-solid fa-chevron-down msg-chevron"></i>
        </div>
      </div>
      <div class="msg-body">
        <div class="msg-body-inner">
          <div class="msg-detail-grid">
            <div class="msg-detail">
              <div class="msg-detail-label">Phone</div>
              <div class="msg-detail-val">${escHtml(m.phone||'—')}</div>
            </div>
            <div class="msg-detail">
              <div class="msg-detail-label">Project Type</div>
              <div class="msg-detail-val">${escHtml(m.type||'—')}</div>
            </div>
            <div class="msg-detail">
              <div class="msg-detail-label">Budget</div>
              <div class="msg-detail-val">${escHtml(m.budget||'—')}</div>
            </div>
          </div>
          <div class="msg-text-label">Message</div>
          <div class="msg-text-box">${escHtml(m.message).replace(/\n/g,'<br>')}</div>
          <div class="msg-actions">
            <a href="mailto:${escHtml(m.email)}?subject=Re: Your Project Inquiry" class="act-btn reply">
              <i class="fa-solid fa-reply"></i> Reply
            </a>
            ${m.phone ? `<a href="tel:${escHtml(m.phone)}" class="act-btn mark-read" style="border-color:rgba(255,255,255,.15);color:var(--muted);">
              <i class="fa-solid fa-phone"></i> Call
            </a>` : ''}
            <button class="act-btn mark-read" onclick="toggleRead('${m.id}')">
              <i class="fa-solid fa-${m.read?'envelope':'envelope-open'}"></i>
              ${m.read ? 'Mark Unread' : 'Mark Read'}
            </button>
            <button class="act-btn delete-btn" onclick="confirmDelete('${m.id}')">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

/* ══════════ CARD TOGGLE ══════════ */
async function toggleCard(id){
  const card = document.getElementById('card-'+id);
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.msg-card.open').forEach(c=>c.classList.remove('open'));
  if(!isOpen){
    card.classList.add('open');
    const idx = cachedMsgs.findIndex(m=>m.id===id);
    if(idx>-1 && !cachedMsgs[idx].read){
      cachedMsgs[idx].read = true;
      try{ await putMessages(cachedMsgs); } catch(e){ console.error(e); }
      renderMessages();
      document.getElementById('statUnread').textContent = cachedMsgs.filter(m=>!m.read).length;
      document.getElementById('unreadCount').textContent = cachedMsgs.filter(m=>!m.read).length;
    }
  }
}

/* ══════════ MARK READ ══════════ */
async function toggleRead(id){
  const idx = cachedMsgs.findIndex(m=>m.id===id);
  if(idx>-1){
    cachedMsgs[idx].read = !cachedMsgs[idx].read;
    showLoad();
    try{ await putMessages(cachedMsgs); } catch(e){ console.error(e); }
    hideLoad();
    renderMessages();
    document.getElementById('statUnread').textContent = cachedMsgs.filter(m=>!m.read).length;
    document.getElementById('unreadCount').textContent = cachedMsgs.filter(m=>!m.read).length;
  }
}

/* ══════════ DELETE ══════════ */
function confirmDelete(id){
  pendingDeleteId = id;
  document.querySelector('.modal-title').textContent = 'Delete Message?';
  document.querySelector('.modal-sub').textContent = 'This action cannot be undone.';
  document.getElementById('deleteModal').classList.add('show');
}
document.getElementById('modalCancel').addEventListener('click',()=>{
  document.getElementById('deleteModal').classList.remove('show');
  pendingDeleteId = null;
});
document.getElementById('modalConfirm').addEventListener('click', async ()=>{
  if(!pendingDeleteId) return;
  if(pendingDeleteId==='__all__'){
    cachedMsgs = [];
  } else {
    cachedMsgs = cachedMsgs.filter(m=>m.id!==pendingDeleteId);
  }
  document.getElementById('deleteModal').classList.remove('show');
  pendingDeleteId = null;
  showLoad();
  try{ await putMessages(cachedMsgs); } catch(e){ console.error(e); }
  hideLoad();
  renderDashboard();
});

/* Clear all */
document.getElementById('clearAllBtn').addEventListener('click',()=>{
  if(!cachedMsgs.length) return;
  pendingDeleteId = '__all__';
  document.querySelector('.modal-title').textContent = 'Delete All Messages?';
  document.querySelector('.modal-sub').textContent = 'This will permanently remove all messages.';
  document.getElementById('deleteModal').classList.add('show');
});

/* ══════════ FILTERS ══════════ */
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderMessages();
  });
});

/* ══════════ HELPERS ══════════ */
function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTime(ts){
  const d = new Date(ts), now = new Date(), diff = now-d;
  if(diff < 60000)    return 'Just now';
  if(diff < 3600000)  return Math.floor(diff/60000)+'m ago';
  if(diff < 86400000) return Math.floor(diff/3600000)+'h ago';
  if(diff < 604800000)return Math.floor(diff/86400000)+'d ago';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
